name: Row level security gate

# The public anon key ships inside the browser bundle. That is how Supabase is
# meant to work, and it is only safe because row level security stands behind
# it. A table created without it is not a slightly weak table, it is a table any
# stranger can read using a key they can copy out of the page source.
#
# It had already happened here, to seventy one tables, and nothing said so. The
# application looked healthy, every page worked, and the exposure was invisible
# until somebody asked the database directly. So this asks on every change.
#
# The check needs credentials, because the only honest answer comes from the
# database itself. Where they are absent the job FAILS. It used to warn and
# then pass, which meant this gate had never once run: its check step took zero
# seconds and showed a green tick on every pull request, and the tick meant
# "did not look". That is worse than no tick at all, because it is the tick a
# reviewer trusts. A gate that cannot look must say so in the only way anybody
# reads, which is red.
#
# So until SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY are set on the
# repository, this check is red on every pull request. That is the honest
# state, and it is the point.
#
# The secret is read into the job environment first and the condition tests the
# environment, because the secrets context is not dependable inside a step
# level if.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: rls-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    name: Every table in the public schema must have row level security
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
      - name: Check row level security
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Row level security was NOT checked, and this gate has been passing"
            echo "::error::green without ever running. Set the SUPABASE_URL repository variable and"
            echo "::error::the SUPABASE_SERVICE_ROLE_KEY repository secret, under Settings, then"
            echo "::error::Secrets and variables, then Actions."
            echo ""
            echo "Nothing was checked. The only honest answer about row level security comes"
            echo "from the database itself, and this job could not reach it. A red check that"
            echo "says so is the truth; the green one it used to show was not."
            exit 1
          fi
          node scripts/rls-check.mjs
