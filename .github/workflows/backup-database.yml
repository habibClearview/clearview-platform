name: A second copy of every record

# 13 September 2026. Supabase takes its own backup every night, inside
# Supabase. Restoring one puts it back over the top of the live project, so
# there is no way to open one and check it is right without destroying what is
# there, and nobody had ever read one. An untested backup is a belief.
#
# This takes a plain, readable copy of every record, reads every line of it
# back before it claims to have worked, and keeps it somewhere that is not
# Supabase. Kept for 90 days, which is a good deal longer than the seven days
# of snapshots the project itself holds.
#
# It runs every night at half past two in the morning UTC, which is half past
# three in Lagos: after the day's work and before anybody starts.

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-database
  cancel-in-progress: false

jobs:
  backup:
    name: Copy every record, and read it back
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'

      # Where the credentials are absent this FAILS rather than passing
      # quietly, for the same reason the row level security gate does: a green
      # tick that means "did not look" is worse than no tick at all, and on a
      # backup it is the worst of the lot, because the day you find out is the
      # day you needed it.
      - name: Check the credentials are here
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::No backup was taken. Set the SUPABASE_URL repository variable and"
            echo "::error::the SUPABASE_SERVICE_ROLE_KEY secret."
            exit 1
          fi

      - name: Take the copy
        run: node scripts/backup-database.mjs

      # The copy is kept as a build artifact rather than committed to the
      # repository, because it holds client records and a git history is for
      # ever: a record deleted at somebody's request has to actually go, and it
      # cannot if it is also a commit nobody can remove.
      - name: Keep it for 90 days
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: clearview-records-${{ github.run_id }}
          path: backup/
          retention-days: 90
          if-no-files-found: error
